# Supply-chain network overlay — merges onto base seed_demo.py data.
# Setup:
#   cp data/supply-chain-network.example.yaml data/supply-chain-network.yaml
#   make seed-gen-sim && make seed-network-overlay
#
# Edit data/supply-chain-network.yaml for local customizations (gitignored).
# Schema reference: general-simulation/tests/fixtures/supply_chain_network.example.yaml
#
# Flights are tagged with company_id/company_name so the Impact Simulation
# company filter can demo multi-tenant views (Spindrift Logistics vs Acme Air Cargo).

