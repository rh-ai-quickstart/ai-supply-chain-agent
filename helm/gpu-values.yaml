global:
  models:
    # Same MaaS path as values.yaml; override id/url/token at deploy time.
    external-model:
      enabled: true
      # id, url and apiToken set at deploy time via --set (or inherit values.yaml)
    llama-3-2-3b-instruct:
      enabled: false

llm-service:
  enabled: false

llama-stack:
  enabled: true
  rawDeploymentMode: true
  pgvector:
    enabled: true
  secrets: {}
  # External model API token set at deploy time via --set
