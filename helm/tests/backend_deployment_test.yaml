suite: backend deployment
templates:
  - templates/backend-deployment.yaml
release:
  name: supply-chain-dashboard
  namespace: supply-chain-dashboard
tests:
  - it: wires backend env and pgvector secret reference
    set:
      backend.enabled: true
      backend.pgvectorSecretName: pgvector
      backend.env.LLAMA_STACK_URL: "http://llamastack.example:8321"
      backend.env.EMBED_MODEL: "all-MiniLM-L6-v2"
      backend.env.PG_HOST: pgvector
      backend.env.PG_PORT: "5432"
      backend.env.PG_USER: postgres
      backend.env.PG_DB: blueprint
      backend.env.GENERAL_SIMULATION_BASE_URL: "http://general-sim-api:8000"
      global.models.llama-3-2-3b-instruct.enabled: true
      global.models.external-model.id: "gpt-4o-mini"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: supply-chain-dashboard-backend
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_URL
            value: "http://llamastack.example:8321"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_MODEL
            value: "llama-3-2-3b-instruct/meta-llama/Llama-3.2-3B-Instruct"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_TIMEOUT_SECONDS
            value: "300"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_OPENAI_MODEL
            value: "external-model/gpt-4o-mini"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENERAL_SIMULATION_BASE_URL
            value: "http://general-sim-api:8000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_HOST
            value: pgvector
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pgvector
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEWS_FEED_URLS
            value: ""
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: uses external-model when local llm is disabled
    set:
      backend.enabled: true
      backend.pgvectorSecretName: pgvector
      backend.env.LLAMA_STACK_URL: "http://llamastack.example:8321"
      backend.env.PG_HOST: pgvector
      backend.env.PG_PORT: "5432"
      backend.env.PG_USER: postgres
      backend.env.PG_DB: blueprint
      global.models.llama-3-2-3b-instruct.enabled: false
      global.models.external-model.id: "Qwen3.6-35B-A3B"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_MODEL
            value: "external-model/Qwen3.6-35B-A3B"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_OPENAI_MODEL
            value: "external-model/Qwen3.6-35B-A3B"

  - it: does not render when backend is disabled
    set:
      backend.enabled: false
    asserts:
      - hasDocuments:
          count: 0
