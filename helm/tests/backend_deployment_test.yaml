suite: backend deployment
templates:
  - templates/backend-deployment.yaml
release:
  name: supply-chain-dashboard
  namespace: supply-chain-dashboard
tests:
  - it: wires backend env from gen-sim api.models.generation
    set:
      backend.enabled: true
      backend.pgvectorSecretName: pgvector
      backend.env.LLAMA_STACK_URL: "http://llamastack.example:8321"
      backend.env.PG_HOST: postgres
      backend.env.PG_PORT: "5432"
      backend.env.PG_USER: sim
      backend.env.PG_DB: sim
      backend.env.GENERAL_SIMULATION_BASE_URL: "http://general-sim-api:8000"
      backend.env.EMBED_MODEL: Nomic-embed-text-v2-moe
      backend.env.EMBED_BASE_URL: https://litemaas.rhoai.rh-aiservices-bu.com
      general-simulation.api.models.generation: "llama-3-2-3b-instruct/meta-llama/Llama-3.2-3B-Instruct"
      general-simulation.api.models.embedding: "sentence-transformers/nomic-ai/nomic-embed-text-v1.5"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: supply-chain-dashboard-backend
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_URL
            value: "http://llamastack.example:8321"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_MODEL
            value: "llama-3-2-3b-instruct/meta-llama/Llama-3.2-3B-Instruct"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_OPENAI_MODEL
            value: "llama-3-2-3b-instruct/meta-llama/Llama-3.2-3B-Instruct"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBED_MODEL
            value: "Nomic-embed-text-v2-moe"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBED_BASE_URL
            value: "https://litemaas.rhoai.rh-aiservices-bu.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_TIMEOUT_SECONDS
            value: "300"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GENERAL_SIMULATION_BASE_URL
            value: "http://general-sim-api:8000"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_HOST
            value: postgres
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: pgvector
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEWS_FEED_URLS
            value: ""
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: defaults EMBED_MODEL to gen-sim api.models.embedding when backend override is empty
    set:
      backend.enabled: true
      backend.pgvectorSecretName: pgvector
      backend.env.LLAMA_STACK_URL: "http://llamastack.example:8321"
      backend.env.PG_HOST: postgres
      backend.env.PG_PORT: "5432"
      backend.env.PG_USER: sim
      backend.env.PG_DB: sim
      backend.env.EMBED_MODEL: ""
      backend.env.EMBED_BASE_URL: ""
      general-simulation.api.models.generation: "llama-3-2-3b-instruct/meta-llama/Llama-3.2-3B-Instruct"
      general-simulation.api.models.embedding: "sentence-transformers/nomic-ai/nomic-embed-text-v1.5"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBED_MODEL
            value: "sentence-transformers/nomic-ai/nomic-embed-text-v1.5"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: EMBED_BASE_URL

  - it: uses any stack model id configured on gen-sim api
    set:
      backend.enabled: true
      backend.pgvectorSecretName: pgvector
      backend.env.LLAMA_STACK_URL: "http://llamastack.example:8321"
      backend.env.PG_HOST: postgres
      backend.env.PG_PORT: "5432"
      backend.env.PG_USER: sim
      backend.env.PG_DB: sim
      general-simulation.api.models.generation: "deepseek-r1-distill-qwen-1-5b/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
      general-simulation.api.models.embedding: "nomic-ai/nomic-embed-text-v1.5"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_MODEL
            value: "deepseek-r1-distill-qwen-1-5b/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_OPENAI_MODEL
            value: "deepseek-r1-distill-qwen-1-5b/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

  - it: resolves backend image from global.registry
    set:
      backend.enabled: true
      backend.pgvectorSecretName: pgvector
      global.registry: quay.io/robertsandoval
      global.imageTag: v1
      backend.image.name: ai-supply-chain-agent-backend
      general-simulation.api.models.generation: "llama-3-2-3b-instruct/meta-llama/Llama-3.2-3B-Instruct"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/robertsandoval/ai-supply-chain-agent-backend:v1

  - it: does not render when backend is disabled
    set:
      backend.enabled: false
    asserts:
      - hasDocuments:
          count: 0
