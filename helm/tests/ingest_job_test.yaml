suite: ingest job
templates:
  - templates/ingest-job.yaml
release:
  name: supply-chain-dashboard
tests:
  - it: renders post-install hook job with llamastack ingest env
    set:
      ingest.enabled: true
      ingest.knowledgeBaseDir: knowledge_base
      backend.env.LLAMA_STACK_URL: "http://llamastack:8321"
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: supply-chain-dashboard-ingest
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: spec.template.spec.containers[0].name
          value: ingest
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LLAMA_STACK_URL
            value: "http://llamastack:8321"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VECTOR_STORE_PROVIDER
            value: "pgvector"
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: keeps failed jobs by default for log inspection
    set:
      ingest.enabled: true
      backend.env.LLAMA_STACK_URL: "http://llamastack:8321"
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/hook-delete-policy"]

  - it: renders hook-delete-policy when configured
    set:
      ingest.enabled: true
      ingest.hookDeletePolicy: before-hook-creation
      backend.env.LLAMA_STACK_URL: "http://llamastack:8321"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: does not render when ingest is disabled
    set:
      ingest.enabled: false
    asserts:
      - hasDocuments:
          count: 0
