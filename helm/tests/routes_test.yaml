suite: frontend route
templates:
  - templates/frontend-route.yaml
release:
  name: supply-chain-dashboard
tests:
  - it: renders frontend route with edge TLS to frontend service
    set:
      frontend.enabled: true
      frontend.route.enabled: true
    asserts:
      - isKind:
          of: Route
      - equal:
          path: metadata.name
          value: supply-chain-dashboard-frontend
      - equal:
          path: spec.to.name
          value: supply-chain-dashboard-frontend
      - equal:
          path: spec.tls.termination
          value: edge
      - equal:
          path: spec.port.targetPort
          value: http

  - it: does not render when frontend route is disabled
    set:
      frontend.enabled: true
      frontend.route.enabled: false
    asserts:
      - hasDocuments:
          count: 0
---
suite: backend route
templates:
  - templates/backend-route.yaml
release:
  name: supply-chain-dashboard
tests:
  - it: renders backend route with edge TLS to backend service
    set:
      backend.enabled: true
      backend.route.enabled: true
    asserts:
      - isKind:
          of: Route
      - equal:
          path: metadata.name
          value: supply-chain-dashboard-backend
      - equal:
          path: spec.to.name
          value: supply-chain-dashboard-backend
      - equal:
          path: spec.tls.termination
          value: edge

  - it: does not render when backend route is disabled
    set:
      backend.enabled: true
      backend.route.enabled: false
    asserts:
      - hasDocuments:
          count: 0
