suite: egress network policy
templates:
  - templates/network-policy-egress.yaml
release:
  name: supply-chain-dashboard
tests:
  - it: renders an allow-all egress policy by default
    set:
      networkPolicy.egress.enabled: true
      networkPolicy.egress.allowAll: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: supply-chain-dashboard-egress
      - equal:
          path: spec.policyTypes[0]
          value: Egress
      - equal:
          path: spec.egress[0]
          value: {}

  - it: renders scoped egress when allowAll is false
    set:
      networkPolicy.egress.enabled: true
      networkPolicy.egress.allowAll: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.egress[0].ports[0].protocol
          value: UDP
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
      - equal:
          path: spec.egress[2].ports[0].port
          value: 443

  - it: does not render when egress is disabled
    set:
      networkPolicy.egress.enabled: false
    asserts:
      - hasDocuments:
          count: 0