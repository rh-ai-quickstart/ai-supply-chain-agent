# Helm secrets — copy to secrets.yaml and fill in values.
# This file should NOT be committed to version control.
#
# Instructions:
#   cp helm/secrets.example.yaml helm/secrets.yaml
#   EDIT helm/secrets.yaml with your secrets
#
# Shared Postgres password notes (default: gen-sim Postgres + Secret/pgvector bridge):
#   - Keep pgvector.secret.password in sync with general-simulation.*.postgres.password.
#   - Omit password keys to keep the demo defaults from values.yaml.
#   - Never set password to "" — an empty overlay blanks the Secret and breaks
#     LlamaStack → Postgres auth.
#   - Never replace pgvector.secret with an empty/comment-only map (YAML null);
#     that wipes user/host/dbname as well.
#   - Changing the password after first install requires deleting the gen-sim
#     Postgres PVC (POSTGRES_PASSWORD applies only on init).
#   - Agent-only installs (general-simulation.enabled: false): set
#     pgvector.enabled: true and use the standalone pgvector PVC instead.

# Unused while llm-service.enabled is false (default). Required only when you
# re-enable a local gated model under llm-service.
llm-service:
  secret:
    hf_token: ""

# Required for default MaaS / LiteMaaS inference (Llama Stack chat backend).
# Use a literal token (not ${env.VAR}) — see values.yaml comment on apiToken.
global:
  models:
    external-model:
      apiToken: "sk-..."

pgvector:
  secret:
    password: "change-me"

# Required when general-simulation.enabled is true (see values.yaml).
# Also create Secret neo4j-auth in the release namespace before install:
#   oc create secret generic neo4j-auth \
#     --from-literal=NEO4J_AUTH="neo4j/<NEO4J_PASSWORD>" \
#     -n supply-chain-dashboard
#
# Gen-sim uses its own OpenAI-compatible LLM for POST /query (separate from
# Llama Stack / MaaS). Model IDs must match what is available at llm.baseUrl:
#   - OpenAI (default): generation=gpt-4o-mini, embedding=text-embedding-3-small
#   - Llama Stack /v1:  use IDs from GET http://llamastack:8321/v1/models
# Use the same postgres password in every postgres.password field below,
# and the same neo4j password as in neo4j-auth.
general-simulation:
  postgres:
    postgres:
      password: "change-me"
  api:
    postgres:
      password: "change-me"
    neo4j:
      password: "change-me"
    llm:
      baseUrl: "https://api.openai.com/v1"
      apiKey: "sk-..."
    models:
      generation: "gpt-4o-mini"
      embedding: "text-embedding-3-small"
      embeddingDimension: "1536"
  bootstrap:
    postgres:
      password: "change-me"
    neo4j:
      password: "change-me"
  ingestion:
    postgres:
      password: "change-me"
    neo4j:
      password: "change-me"
    llm:
      baseUrl: "https://api.openai.com/v1"
      apiKey: "sk-..."
    models:
      generation: "gpt-4o-mini"
      embedding: "text-embedding-3-small"
      embeddingDimension: "1536"
