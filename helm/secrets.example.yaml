# Helm secrets — copy to secrets.yaml and fill in values.
# This file should NOT be committed to version control.
#
# Instructions:
#   cp helm/secrets.example.yaml helm/secrets.yaml
#   EDIT helm/secrets.yaml with your secrets
#
# Shared Postgres password notes:
#   - Keep general-simulation.postgres.postgres.password in sync with every
#     general-simulation.*.postgres.password block in values.yaml.
#   - Omit password keys to keep the demo defaults from values.yaml.
#   - Never set password to "" — an empty overlay blanks credentials and breaks
#     LlamaStack → Postgres auth (Secret/pgvector is created by gen-sim).
#   - Changing the password after first install requires deleting the gen-sim
#     Postgres PVC (POSTGRES_PASSWORD applies only on init).

# --- Pick ONE profile (uncomment the block you need) ---
#
# Default (helm/values.yaml) — in-cluster llm-service:
# general-simulation:
#   llm-service:
#     secret:
#       hf_token: "hf_..."
#
# MaaS (helm/values-maas.yaml):
# general-simulation:
#   global:
#     models:
#       external-model:
#         apiToken: "your-maas-api-key"
# backend:
#   env:
#     EMBED_API_KEY: "your-maas-api-key"

# Optional shared Postgres override (uncomment AND set the same password everywhere):
# general-simulation:
#   postgres:
#     postgres:
#       password: "change-me"
#   api:
#     postgres:
#       password: "change-me"
#   bootstrap:
#     postgres:
#       password: "change-me"
#   ingestion:
#     postgres:
#       password: "change-me"

# Neo4j: set the same password on every general-simulation.*.neo4j.password block.
# Chart 0.0.1 creates Secret neo4j-auth from bootstrap.neo4j.password.
#
# general-simulation:
#   api:
#     neo4j:
#       password: "change-me"
#   bootstrap:
#     neo4j:
#       password: "change-me"
#   ingestion:
#     neo4j:
#       password: "change-me"
