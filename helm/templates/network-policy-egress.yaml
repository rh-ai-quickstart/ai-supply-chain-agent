{{- if and .Values.networkPolicy .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Unblocks outbound connections denied by a namespace NetworkPolicy
    # default-deny (OpenAI/LiteMaaS, RSS, HuggingFace, etc.). OpenSky is a
    # separate problem: they drop AWS/hyperscaler source IPs, so allowlisting
    # in-cluster does not restore connectivity. When allowAll is true this is
    # "allow all egress" at the NetworkPolicy layer only.
    description: Allow all pods in this namespace to establish outbound connections.
spec:
  # Applies to every pod in the release namespace (backend, ingest, etc.).
  podSelector: {}
  policyTypes:
    - Egress
  egress:
  {{- if .Values.networkPolicy.egress.allowAll }}
    # No destination/port constraints => allow egress to anywhere (cluster +
    # internet). This is the pragmatic default to unblock external API calls.
    - {}
  {{- else }}
    # DNS resolution (RFC 1918 + external hostnames).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Same-namespace cluster services (pgvector, llamastack, general-sim).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    # External HTTPS/HTTP APIs: OpenSky, LiteMaaS, OpenAI, RSS feeds.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
  {{- end }}
{{- end }}