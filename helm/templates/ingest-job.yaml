{{- if .Values.ingest.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ingest
  annotations:
    # Fires after every helm install / upgrade.
    helm.sh/hook: post-install,post-upgrade
    # Kept empty by default so a Failed Job and its Pod are left in place and
    # you can inspect logs (`oc logs job/<release>-ingest`) after a failed
    # install. Set ingest.hookDeletePolicy=before-hook-creation to auto-delete
    # the previous Job before the next helm run instead.
    {{- with .Values.ingest.hookDeletePolicy }}
    helm.sh/hook-delete-policy: {{ . }}
    {{- end }}
    helm.sh/hook-weight: "10"
spec:
  backoffLimit: 2
  # 10-minute hard deadline — covers slow cold-starts of Postgres / llamastack.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-ingest
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # ── Init containers: block until dependencies are accepting traffic ──
      initContainers:

        # 1. Wait for shared Postgres to accept TCP connections on port 5432.
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres at {{ .Values.backend.env.PG_HOST }}:{{ .Values.backend.env.PG_PORT }} ..."
              until nc -z {{ .Values.backend.env.PG_HOST }} {{ .Values.backend.env.PG_PORT }}; do
                echo "  Postgres not ready — retrying in 5s"
                sleep 5
              done
              echo "Postgres is up."

        # 2. Wait for Llama Stack to return HTTP 200 on /v1/models.
        - name: wait-for-llamastack
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -c
            - |
              echo "Waiting for llamastack at {{ .Values.backend.env.LLAMA_STACK_URL }}/v1/models ..."
              until wget -qO- {{ .Values.backend.env.LLAMA_STACK_URL }}/v1/models > /dev/null 2>&1; do
                echo "  llamastack not ready — retrying in 5s"
                sleep 5
              done
              echo "llamastack is up."

      # ── Main ingest container ────────────────────────────────────────────
      containers:
        - name: ingest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: {{ include "supply-chain.containerImage" (dict "image" .Values.ingest.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command: ["python", "main.py"]
          env:
            # ── Ingestion settings ─────────────────────────────────────────
            - name: INGEST_STRATEGY
              value: {{ .Values.ingest.strategy | quote }}
            - name: KNOWLEDGE_BASE_DIR
              value: {{ .Values.ingest.knowledgeBaseDir | quote }}
            - name: INGEST_GLOB
              value: {{ .Values.ingest.glob | quote }}
            - name: INGEST_DROP_OLD
              value: {{ .Values.ingest.dropOld | quote }}
            - name: INGEST_CHUNK_SIZE
              value: {{ .Values.ingest.chunkSize | quote }}
            - name: INGEST_CHUNK_OVERLAP
              value: {{ .Values.ingest.chunkOverlap | quote }}
            # ── Embedding service ──────────────────────────────────────────
            - name: LLAMA_STACK_URL
              value: {{ .Values.backend.env.LLAMA_STACK_URL | quote }}
            - name: EMBED_MODEL
              value: {{ .Values.backend.env.EMBED_MODEL | quote }}
            # ── PGVector connection (PG_ prefix avoids K8s collision) ──────
            - name: PG_HOST
              value: {{ .Values.backend.env.PG_HOST | quote }}
            - name: PG_PORT
              value: {{ .Values.backend.env.PG_PORT | quote }}
            - name: PG_USER
              value: {{ .Values.backend.env.PG_USER | quote }}
            - name: PG_DB
              value: {{ .Values.backend.env.PG_DB | quote }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.pgvectorSecretName }}
                  key: password
{{- end }}
