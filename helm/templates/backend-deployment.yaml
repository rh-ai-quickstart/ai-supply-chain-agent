{{- if .Values.backend.enabled }}
{{- $genSim := index .Values "general-simulation" }}
{{- $stackModel := required "general-simulation.api.models.generation is required (gen-sim owns model selection)" $genSim.api.models.generation }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          image: {{ include "supply-chain.containerImage" (dict "image" .Values.backend.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: LLAMA_STACK_URL
              value: {{ .Values.backend.env.LLAMA_STACK_URL | quote }}
            - name: LLAMA_STACK_MODEL
              value: {{ $stackModel | quote }}
            - name: LLAMA_STACK_TIMEOUT_SECONDS
              value: {{ .Values.backend.env.LLAMA_STACK_TIMEOUT_SECONDS | default "300" | quote }}
            - name: EMBED_MODEL
              value: {{ .Values.backend.env.EMBED_MODEL | default $genSim.api.models.embedding | quote }}
            - name: LLAMA_STACK_OPENAI_MODEL
              value: {{ $stackModel | quote }}
            - name: GENERAL_SIMULATION_BASE_URL
              value: {{ .Values.backend.env.GENERAL_SIMULATION_BASE_URL | quote }}
            # Optional override for air-gapped / egress-restricted clusters.
            # Format: "Name|https://feed.example/rss;Other|https://..."
            # Empty uses built-in BBC + Guardian feeds (requires HTTPS egress).
            - name: NEWS_FEED_URLS
              value: {{ .Values.backend.env.NEWS_FEED_URLS | default "" | quote }}
            # PG_ prefix avoids collision with the Kubernetes-injected
            # PGVECTOR_PORT=tcp://ip:port service-discovery variable.
            - name: PG_HOST
              value: {{ .Values.backend.env.PG_HOST | quote }}
            - name: PG_PORT
              value: {{ .Values.backend.env.PG_PORT | quote }}
            - name: PG_USER
              value: {{ .Values.backend.env.PG_USER | quote }}
            - name: PG_DB
              value: {{ .Values.backend.env.PG_DB | quote }}
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.pgvectorSecretName }}
                  key: password
{{- end }}
