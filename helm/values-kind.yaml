# Kind / plain Kubernetes CI overrides (use with: make helm-install-kind)
#
# Availability contract for helm --wait (must become Ready/Complete):
#   backend, frontend, pgvector, gen-sim postgres, neo4j (Service name neo4j),
#   general-sim-api, then general-sim-bootstrap post-install hook.
#
# Kept off so they cannot block --wait or pull heavy images:
#   llama-stack, llm-service, umbrella ingest Job, gen-sim OpenSky CronJob, vLLM.
# OpenShift Routes disabled (no router on Kind).

# Shared DB: bridge Secret/pgvector → Service postgres (password must match below).
pgvector:
  enabled: false
  secret:
    password: kind-demo-password

llama-stack:
  enabled: false

llm-service:
  enabled: false

backend:
  route:
    enabled: false
  image:
    pullPolicy: IfNotPresent
  env:
    # Unused while llama-stack is off; backend probes /healthz (liveness-only).
    LLAMA_STACK_URL: http://llamastack:8321
    PG_HOST: postgres
    PG_USER: sim
    PG_DB: sim

frontend:
  route:
    enabled: false
  image:
    pullPolicy: IfNotPresent

ingest:
  enabled: false
  image:
    pullPolicy: IfNotPresent

# Demo-only credentials so general-simulation's Postgres/Neo4j secret templates
# render in the ephemeral Kind namespace (see helm/secrets.example.yaml for the
# real-deployment equivalent). neo4j-auth and neo4j-sa are pre-created by
# .github/actions/kind before `helm install`.
#
# Published gen-sim defaults pin Neo4j to gp3-csi + 2CPU/4Gi (OpenShift/AWS).
# Kind has neither that StorageClass nor the headroom — without these overrides
# helm --wait times out on a Pending Neo4j PVC.
#
# fullnameOverride is required: the official neo4j chart names Service/STS after
# the Helm release (e.g. supply-chain-dashboard). api/bootstrap wait for host
# "neo4j", so without this override general-sim-api stays Init:wait-for-deps.
#
# Published gen-sim also pins podSpec.serviceAccountName=neo4j-sa (OpenShift
# anyuid). Clear it here so the official chart uses the default SA on Kind;
# the Kind action still creates neo4j-sa if the overlay is missed.
general-simulation:
  # The umbrella chart deploys its own llama-stack; disable the subchart's
  # bundled one to avoid a duplicate "pgvector" Secret (llamastack-pg-secret.yaml),
  # which fails helm install with "secrets pgvector already exists".
  llama-stack:
    enabled: false
    pgvector:
      enabled: false
  postgres:
    postgres:
      password: kind-demo-password
  neo4j:
    fullnameOverride: neo4j
    # Kind action pre-creates neo4j-auth; skip live-cluster lookups during helm
    # template/install so CI does not depend on lookup timing.
    disableLookups: true
    # Empty string overrides the published chart's neo4j-sa pin (OpenShift).
    podSpec:
      serviceAccountName: ""
    neo4j:
      resources:
        # Chart enforces memory >= 2Gi; keep CPU light for Kind runners.
        cpu: "500m"
        memory: 2Gi
    volumes:
      data:
        mode: dynamic
        dynamic:
          accessModes:
            - ReadWriteOnce
          requests:
            storage: 2Gi
          # Kind local-path provisioner (default StorageClass name).
          storageClassName: standard
  api:
    # No OpenShift router on Kind (requires gen-sim chart with route toggle).
    route:
      enabled: false
    llm:
      # Not required for /health Ready; keeps Secret non-empty for Kind.
      apiKey: kind-unused
    postgres:
      password: kind-demo-password
    neo4j:
      password: kind-demo-password
  bootstrap:
    postgres:
      password: kind-demo-password
    neo4j:
      password: kind-demo-password
  ingestion:
    enabled: false
    postgres:
      password: kind-demo-password
    neo4j:
      password: kind-demo-password
