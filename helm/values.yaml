# Image registry — override with: --set global.registry=quay.io/<your-org>
# Propagates to supply-chain app images and the general-simulation subchart.
global:
  registry: quay.io/rh-ai-quickstart
  imageTag: latest
  images:
    backend: ai-supply-chain-agent-backend
    frontend: ai-supply-chain-agent-frontend
    ingest: ai-supply-chain-agent-ingestion
    app: general-sim-api
    postgres: general-sim-postgres

# Platform infra (Postgres, Neo4j, Llama Stack, llm-service, API, ingestion)
# is deployed via the general-simulation umbrella subchart (chart 0.0.1).
#
# LiteMaaS profile (default):
#   - Chat: Llama Stack → global.models.external-model → LiteMaaS /v1/chat/completions
#   - Supply-chain RAG/ingest: backend.env.EMBED_BASE_URL → LiteMaaS /v1/embeddings
#   - Scenario create (gen-sim inject): api.models.embedding → Llama Stack inline
#     sentence-transformers (LiteMaaS embed models are not registered on the stack).
# Model selection for chat is owned under general-simulation — supply-chain reads
# general-simulation.api.models.generation for LLAMA_STACK_MODEL.
general-simulation:
  global:
    models:
      # Disable gen-sim default OpenAI provider (enabled: true in the subchart).
      openai:
        enabled: false
        id: gpt-4o-mini          # or gpt-4o, etc.
        url: https://api.openai.com/v1
      deepseek-r1-distill-qwen-1-5b:
        enabled: false
        id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
        apiToken: unused
      # LiteMaaS chat model — disable llm-service; set apiToken in helm/secrets.yaml.
      external-model:
        enabled: true
        id: Qwen2.5-VL-7B-Instruct
        url: https://litemaas.rhoai.rh-aiservices-bu.com/v1
        apiToken: ""
  openshift:
    neo4j:
      scc:
        enabled: true
  postgres:
    postgres:
      username: sim
      # Demo default — override via helm/secrets.yaml (keep in sync across
      # postgres.* blocks below). Changing after install requires deleting the
      # gen-sim Postgres PVC (POSTGRES_PASSWORD applies only on init).
      password: password
      database: sim
  neo4j:
    fullnameOverride: neo4j
    disableLookups: true
  bootstrap:
    enabled: true
    waitFor:
      enabled: true
      timeoutSeconds: 300
    postgres:
      user: sim
      password: password
      database: sim
      host: postgres
    neo4j:
      password: password
  llama-stack:
    enabled: true
    rawDeploymentMode: true
    # Secret/pgvector is created by gen-sim (points Llama Stack at Postgres).
    pgvector:
      enabled: true
  llm-service:
    enabled: false
    device: cpu
    secret:
      enabled: true
      hf_token: "" # Set in helm/secrets.yaml
    models:
      deepseek-r1-distill-qwen-1-5b:
        enabled: true
        id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
        device: gpu
  api:
    waitFor:
      enabled: true
      timeoutSeconds: 300
      startupFailureThreshold: 60
    llm:
      backend: openai
      baseUrl: http://llamastack:8321/v1
      apiKey: unused
    models:
      # Stack model id = <providerKey>/<model.id> (see global.models.external-model above).
      generation: external-model/Qwen2.5-VL-7B-Instruct
      # Llama Stack inline embedder — full stack model id (see GET /v1/models on llamastack).
      embedding: sentence-transformers/nomic-ai/nomic-embed-text-v1.5
      embeddingDimension: "768"
    postgres:
      user: sim
      password: password
      database: sim
      host: postgres
    neo4j:
      password: password
  # Live OpenSky CronJob (opensky-network.org). Keep disabled on AWS/hyperscaler
  # clusters: OpenSky drops those source IPs at TCP (documented; they refuse AI
  # dashboard allowlists). Cluster NetworkPolicy / EgressFirewall cannot fix it.
  # Seed offline demo data with general-simulation scripts/seed_demo.py instead.
  # To use live data: egress via a non-hyperscaler proxy, or swap the adapter.
  ingestion:
    enabled: true
    models:
      generation: external-model/Qwen2.5-VL-7B-Instruct
      embedding: sentence-transformers/nomic-ai/nomic-embed-text-v1.5
      embeddingDimension: "768"
    postgres:
      user: sim
      password: password
      database: sim
      host: postgres
    neo4j:
      password: password

imagePullSecrets: []

backend:
  enabled: true
  replicaCount: 1
  image:
    name: ai-supply-chain-agent-backend
    tag: ""
    pullPolicy: Always
  service:
    port: 5001
  route:
    enabled: true
    host: ""
    timeout: 5m
  # Secret/pgvector (created by general-simulation for Llama Stack) — key "password".
  pgvectorSecretName: pgvector
  env:
    LLAMA_STACK_URL: http://llamastack:8321
    # LLAMA_STACK_MODEL / LLAMA_STACK_OPENAI_MODEL come from general-simulation.api.models.generation.
    LLAMA_STACK_TIMEOUT_SECONDS: "300"
    # Direct LiteMaaS embeddings for supply-chain RAG + ingest (bypasses Llama Stack).
    # EMBED_API_KEY in helm/secrets.yaml. Gen-sim scenario inject keeps api.models.embedding above.
    EMBED_BASE_URL: https://litemaas.rhoai.rh-aiservices-bu.com
    EMBED_MODEL: Nomic-embed-text-v2-moe
    # PG_ prefix avoids collision with a Kubernetes service-discovery
    # PGVECTOR_PORT=tcp://… var if a Service named pgvector exists.
    GENERAL_SIMULATION_BASE_URL: "http://general-sim-api:8000"
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_USER: sim
    PG_DB: sim
    # News ticker RSS feeds (HTTPS egress required to reach defaults).
    # Leave empty for BBC World/Business + Guardian World.
    # Override for air-gapped clusters: "Internal|https://intranet.example/rss"
    NEWS_FEED_URLS: ""

ingest:
  # Set to true to run the knowledge-base ingestion Job on every
  # helm install / upgrade.
  enabled: true
  # Hook deletion policy on the post-install/post-upgrade Job. Leave empty to
  # keep Completed/Failed Jobs (and their Pods) so you can read logs after a
  # failed run; set to "before-hook-creation" to auto-delete the prior Job.
  hookDeletePolicy: ""
  image:
    name: ai-supply-chain-agent-ingestion
    tag: ""
    pullPolicy: Always
  # "langchain" — client-side chunking/embedding via LangChain + PGVector (required for
  # LiteMaaS embeddings; llamastack strategy uses inline sentence-transformers in OGX).
  # "llamastack" — server-side: uploads files to LlamaStack vector stores API.
  strategy: "langchain"
  # Path inside the container where .txt files live (baked into the image).
  knowledgeBaseDir: "knowledge_base"
  # File glob relative to knowledgeBaseDir.
  glob: "**/*.txt"
  # --- langchain strategy only ---
  # Drop the existing collection before inserting (clean re-ingest).
  dropOld: "true"
  # Chunking parameters forwarded to RecursiveCharacterTextSplitter.
  chunkSize: "1000"
  chunkOverlap: "200"

frontend:
  enabled: true
  replicaCount: 1
  image:
    name: ai-supply-chain-agent-frontend
    tag: ""
    pullPolicy: Always
  service:
    port: 8080
  # Nginx /api proxy timeouts (envsubst into default.conf.template). Increase for slow LLM chat.
  apiProxy:
    connectTimeout: 60s
    sendTimeout: 300s
    readTimeout: 300s
  # Optional override for the nginx BACKEND_UPSTREAM (default: http://<release>-backend:<port>).
  # Set only when the frontend must proxy to a backend outside the release (e.g. a shared API).
  apiProxyUpstream: ""
  route:
    enabled: true
    host: "" # Set the host for the frontend route, this is done dynamically in the frontend deployment template.
    timeout: 5m
