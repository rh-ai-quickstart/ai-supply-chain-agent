global:
  models:
    llama-3-2-3b-instruct:
      id: meta-llama/Llama-3.2-3B-Instruct
      enabled: false
    # Red Hat LiteMaaS (OpenAI-compatible). Set apiToken in helm/secrets.yaml.
    # Do NOT use ${env.VAR} here — the llama-stack wait-for-models init script
    # expands it unquoted and bash fails with "bad substitution".
    external-model:
      enabled: true
      id: Qwen3.6-35B-A3B
      url: https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com/v1
      apiToken: "" # Set in helm/secrets.yaml

pgvector:
  enabled: true
  secret:
    create: true
    user: postgres
    # ⚠️ Demo default only. Override via helm/secrets.yaml if needed.
    # Do NOT set password to "" — an empty overlay blanks the Secret and
    # breaks LlamaStack auth to PGVector.
    # Changing the password after first install requires deleting PVC
    # pg-data-pgvector-0 (Postgres applies POSTGRES_PASSWORD only on init).
    password: password
    dbname: blueprint
    host: pgvector
    port: "5432"

llama-stack:
  enabled: true
  rawDeploymentMode: true
  pgvector:
    enabled: true
  secrets: {}

# Local vLLM disabled — inference comes from MaaS (global.models.external-model).
llm-service:
  enabled: false
  device: cpu
  secret:
    # Unused while llm-service.enabled is false; keep for re-enabling local models.
    hf_token: ""
    enabled: true
  models:
    llama-3-2-3b-instruct:
      enabled: false
      device: cpu

# General Simulation platform (optional Helm subchart).
# Same-namespace Service URL when enabled. For a standalone gen-sim install in
# another project, set enabled: false and point GENERAL_SIMULATION_BASE_URL at
# http://general-sim-api.<ns>.svc:8000 instead.
#
# Gen-sim uses its own OpenAI-compatible LLM (api.openai.com by default) — not
# LiteMaaS. Set api/ingestion.llm.apiKey in helm/secrets.yaml.
general-simulation:
  enabled: true
  vllm:
    enabled: false
  # Override subchart default (quay.io/robertsandoval/general-sim-app).
  api:
    image: quay.io/rh-ai-quickstart/general-simulation-api:latest
    # Init (TCP) → lifespan (pool/driver) → startup/readiness (/health).
    waitFor:
      enabled: true
      timeoutSeconds: 300
      startupFailureThreshold: 60
    llm:
      backend: openai
      baseUrl: https://api.openai.com/v1
      # apiKey via helm/secrets.yaml
  bootstrap:
    image: quay.io/rh-ai-quickstart/general-simulation-api:latest
    waitFor:
      enabled: true
      timeoutSeconds: 300
  ingestion:
    image: quay.io/rh-ai-quickstart/general-simulation-api:latest
    llm:
      backend: openai
      baseUrl: https://api.openai.com/v1
      # apiKey via helm/secrets.yaml
  # Passwords via helm/secrets.yaml (see secrets.example.yaml) — do not commit.
  # postgres.postgres.password, api/bootstrap/ingestion postgres+neo4j passwords,
  # and Neo4j Secret neo4j-auth must be provided before install.

imagePullSecrets: []

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/rh-ai-quickstart/ai-supply-chain-agent-backend
    tag: dev
    pullPolicy: Always
  service:
    port: 5001
  route:
    enabled: true
    host: ""
    timeout: 5m
  # Name of the Secret created by the pgvector sub-chart that holds the
  # database password under the key "password".
  pgvectorSecretName: pgvector
  env:
    LLAMA_STACK_URL: http://llamastack.supply-chain-dashboard.svc.cluster.local:8321
    # Overridden by backend-deployment from global.models when local model is off:
    # external-model/<id>
    LLAMA_STACK_MODEL: external-model/Qwen3.6-35B-A3B
    # OpenAI client timeout (seconds) for chat and vector-store API calls.
    LLAMA_STACK_TIMEOUT_SECONDS: "300"
    EMBED_MODEL: all-MiniLM-L6-v2
    # PG_ prefix avoids collision with the Kubernetes service-discovery
    # variable PGVECTOR_PORT=tcp://ip:port that is auto-injected for the
    # pgvector Service, which would corrupt SQLAlchemy URL parsing.
    # Same-namespace short name when general-simulation is a subchart.
    GENERAL_SIMULATION_BASE_URL: "http://general-sim-api:8000"
    PG_HOST: pgvector
    PG_PORT: "5432"
    PG_USER: postgres
    PG_DB: blueprint
    # News ticker RSS feeds (HTTPS egress required to reach defaults).
    # Leave empty for BBC World/Business + Guardian World.
    # Override for air-gapped clusters: "Internal|https://intranet.example/rss"
    NEWS_FEED_URLS: ""

ingest:
  # Set to true to run the knowledge-base ingestion Job on every
  # helm install / upgrade.
  enabled: true
  image:
    repository: quay.io/rh-ai-quickstart/ai-supply-chain-agent-ingestion
    tag: dev
    pullPolicy: Always
  # "langchain" — client-side chunking/embedding via LangChain + PGVector.
  # "llamastack" — server-side: uploads files to LlamaStack, which handles
  #                chunking, embedding, and storage internally.
  strategy: "llamastack" # LlamaStack is the default strategy
  # Path inside the container where .txt files live (baked into the image).
  knowledgeBaseDir: "knowledge_base"
  # File glob relative to knowledgeBaseDir.
  glob: "**/*.txt"
  # --- langchain strategy only ---
  # Drop the existing collection before inserting (clean re-ingest).
  dropOld: "true"
  # Chunking parameters forwarded to RecursiveCharacterTextSplitter.
  chunkSize: "1000"
  chunkOverlap: "200"

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/rh-ai-quickstart/ai-supply-chain-agent-frontend
    tag: dev
    pullPolicy: Always
  service:
    port: 8080
  # Nginx /api proxy timeouts (envsubst into default.conf.template). Increase for slow LLM chat.
  apiProxy:
    connectTimeout: 60s
    sendTimeout: 300s
    readTimeout: 300s
  route:
    enabled: true
    host: "" # Set the host for the frontend route, this is done dynamically in the frontend deployment template.
    timeout: 5m
