global:
  models:
    llama-3-2-3b-instruct:
      id: meta-llama/Llama-3.2-3B-Instruct
      enabled: false
    # Red Hat LiteMaaS (OpenAI-compatible). Set apiToken in helm/secrets.yaml.
    # Do NOT use ${env.VAR} here — the llama-stack wait-for-models init script
    # expands it unquoted and bash fails with "bad substitution".
    external-model:
      enabled: true
      id: Qwen3.6-35B-A3B
      url: https://litemaas.rhoai.rh-aiservices-bu.com/v1
      apiToken: "" # Set in helm/secrets.yaml

# Shared Postgres: when general-simulation is enabled (default), disable the
# standalone pgvector StatefulSet and reuse gen-sim's Postgres (AGE + vector +
# PostGIS). The umbrella template creates Secret/pgvector for Llama Stack.
# For agent-only installs (general-simulation.enabled: false), set
# pgvector.enabled: true so the subchart deploys its own DB.
pgvector:
  enabled: false
  secret:
    create: true
    # Must match general-simulation.postgres.postgres.username / database /
    # password (Service hostname is "postgres").
    user: sim
    # ⚠️ Demo default only. Override via helm/secrets.yaml if needed.
    # Do NOT set password to "" — an empty overlay blanks the Secret and
    # breaks LlamaStack auth to Postgres.
    # Changing the password after first install requires deleting the gen-sim
    # Postgres PVC (POSTGRES_PASSWORD applies only on init).
    password: password
    dbname: sim
    host: postgres
    port: "5432"

llama-stack:
  enabled: true
  rawDeploymentMode: true
  pgvector:
    enabled: true
  secrets: {}

# Local vLLM disabled — inference comes from MaaS (global.models.external-model).
llm-service:
  enabled: false
  device: cpu
  secret:
    # Unused while llm-service.enabled is false; keep for re-enabling local models.
    hf_token: ""
    enabled: true
  models:
    llama-3-2-3b-instruct:
      enabled: false
      device: cpu

# General Simulation platform (optional Helm subchart).
# Same-namespace Service URL when enabled. For a standalone gen-sim install in
# another project, set enabled: false and point GENERAL_SIMULATION_BASE_URL at
# http://general-sim-api.<ns>.svc:8000 instead.
#
# Gen-sim uses its own OpenAI-compatible LLM (api.openai.com by default) — not
# LiteMaaS. Set api/ingestion.llm.apiKey in helm/secrets.yaml.
general-simulation:
  enabled: true
  # The umbrella chart deploys its own llama-stack; disable the subchart's
  # bundled one so it does not also render a duplicate "pgvector" Secret
  # (llamastack-pg-secret.yaml), which breaks `helm install` with
  # "secrets pgvector already exists".
  llama-stack:
    enabled: false
    pgvector:
      enabled: false
  vllm:
    enabled: false
  # Stable Service/STS name so api/bootstrap can wait on host "neo4j" even when
  # this chart is installed under a parent release (e.g. supply-chain-dashboard).
  # Changing this on an existing install recreates Neo4j with a new PVC.
  neo4j:
    fullnameOverride: neo4j
    # gen-sim pins Neo4j to ServiceAccount neo4j-sa (anyuid on OpenShift). The
    # umbrella chart creates the SA; cluster admins must grant SCC before install:
    #   oc adm policy add-scc-to-user anyuid system:serviceaccount:<ns>:neo4j-sa
  # Override subchart default (quay.io/robertsandoval/general-sim-app).
  api:
    image: quay.io/rh-ai-quickstart/general-simulation-api:latest
    # Init (TCP) → lifespan (pool/driver) → startup/readiness (/health).
    waitFor:
      enabled: true
      timeoutSeconds: 300
      startupFailureThreshold: 60
    llm:
      backend: openai
      baseUrl: https://api.openai.com/v1
      # apiKey via helm/secrets.yaml
    postgres:
      user: sim
      password: password
      database: sim
      host: postgres
  bootstrap:
    image: quay.io/rh-ai-quickstart/general-simulation-api:latest
    waitFor:
      enabled: true
      timeoutSeconds: 300
    postgres:
      user: sim
      password: password
      database: sim
      host: postgres
  # Live OpenSky CronJob (opensky-network.org). Keep disabled on AWS/hyperscaler
  # clusters: OpenSky drops those source IPs at TCP (documented; they refuse AI
  # dashboard allowlists). Cluster NetworkPolicy / EgressFirewall cannot fix it.
  # Seed offline demo data with general-simulation scripts/seed_demo.py instead.
  # To use live data: egress via a non-hyperscaler proxy, or swap the adapter.
  ingestion:
    enabled: false
    image: quay.io/rh-ai-quickstart/general-simulation-api:latest
    llm:
      backend: openai
      baseUrl: https://api.openai.com/v1
      # apiKey via helm/secrets.yaml
    postgres:
      user: sim
      password: password
      database: sim
      host: postgres

imagePullSecrets: []

backend:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/rh-ai-quickstart/ai-supply-chain-agent-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 5001
  route:
    enabled: true
    host: ""
    timeout: 5m
  # Secret/pgvector (bridge template or pgvector subchart) — key "password".
  pgvectorSecretName: pgvector
  env:
    LLAMA_STACK_URL: http://llamastack.supply-chain-dashboard.svc.cluster.local:8321
    # LLAMA_STACK_MODEL is set by backend-deployment from global.models
    # (external-model/<id> or llama-3-2-3b-instruct/<id>), not from this map.
    # OpenAI client timeout (seconds) for chat and vector-store API calls.
    LLAMA_STACK_TIMEOUT_SECONDS: "300"
    EMBED_MODEL: all-MiniLM-L6-v2
    # PG_ prefix avoids collision with a Kubernetes service-discovery
    # PGVECTOR_PORT=tcp://… var if a Service named pgvector exists.
    # Same-namespace short name when general-simulation is a subchart.
    GENERAL_SIMULATION_BASE_URL: "http://general-sim-api:8000"
    # Shared gen-sim Postgres (when pgvector.enabled is false).
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_USER: sim
    PG_DB: sim
    # News ticker RSS feeds (HTTPS egress required to reach defaults).
    # Leave empty for BBC World/Business + Guardian World.
    # Override for air-gapped clusters: "Internal|https://intranet.example/rss"
    NEWS_FEED_URLS: ""

ingest:
  # Set to true to run the knowledge-base ingestion Job on every
  # helm install / upgrade.
  enabled: true
  # Hook deletion policy on the post-install/post-upgrade Job. Leave empty to
  # keep Completed/Failed Jobs (and their Pods) so you can read logs after a
  # failed run; set to "before-hook-creation" to auto-delete the prior Job.
  hookDeletePolicy: ""
  image:
    repository: quay.io/rh-ai-quickstart/ai-supply-chain-agent-ingestion
    tag: latest
    pullPolicy: Always
  # "langchain" — client-side chunking/embedding via LangChain + PGVector.
  # "llamastack" — server-side: uploads files to LlamaStack, which handles
  #                chunking, embedding, and storage internally.
  strategy: "llamastack" # LlamaStack is the default strategy
  # Path inside the container where .txt files live (baked into the image).
  knowledgeBaseDir: "knowledge_base"
  # File glob relative to knowledgeBaseDir.
  glob: "**/*.txt"
  # --- langchain strategy only ---
  # Drop the existing collection before inserting (clean re-ingest).
  dropOld: "true"
  # Chunking parameters forwarded to RecursiveCharacterTextSplitter.
  chunkSize: "1000"
  chunkOverlap: "200"

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: quay.io/rh-ai-quickstart/ai-supply-chain-agent-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 8080
  # Nginx /api proxy timeouts (envsubst into default.conf.template). Increase for slow LLM chat.
  apiProxy:
    connectTimeout: 60s
    sendTimeout: 300s
    readTimeout: 300s
  # Optional override for the nginx BACKEND_UPSTREAM (default: http://<release>-backend:<port>).
  # Set only when the frontend must proxy to a backend outside the release (e.g. a shared API).
  apiProxyUpstream: ""
  route:
    enabled: true
    host: "" # Set the host for the frontend route, this is done dynamically in the frontend deployment template.
    timeout: 5m
