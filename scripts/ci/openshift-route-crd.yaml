# Minimal Route CRD so Helm can apply OpenShift Routes on Kind/plain Kubernetes.
# Kind smoke does not use the router; ClusterIP Services cover in-cluster access.
# Prefer disabling routes via values when the chart supports it
# (general-simulation.api.route.enabled=false).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: routes.route.openshift.io
spec:
  group: route.openshift.io
  scope: Namespaced
  names:
    plural: routes
    singular: route
    kind: Route
    listKind: RouteList
    shortNames:
      - rt
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
