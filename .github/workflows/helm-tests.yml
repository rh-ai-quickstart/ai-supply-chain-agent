name: Helm tests

# Same triggers as backend and frontend unit test workflows.
on:
  push:
    branches: [main, master, development, chore/*, feat/*]
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "helm/**"
      - "Makefile"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/helm-tests.yml"
  pull_request:
    branches: [main, master, development]
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "helm/**"
      - "Makefile"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/helm-tests.yml"
  workflow_dispatch:

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      # Pin 1.0.3: newer plugin releases use platformHooks (Helm >= 3.18 only).
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.3

      - name: Lint and unit test chart
        run: make helm-test
