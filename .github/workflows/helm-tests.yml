name: Helm tests

# Same triggers as backend and frontend unit test workflows.
on:
  push:
    branches: [main, master, development]
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "helm/**"
      - "Makefile"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/helm-tests.yml"
  pull_request:
    branches: [main, master, development]
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "helm/**"
      - "Makefile"
      - ".github/workflows/backend-tests.yml"
      - ".github/workflows/frontend-tests.yml"
      - ".github/workflows/helm-tests.yml"
  workflow_dispatch:

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # helm/Chart.yaml pulls the general-simulation subchart from a sibling
      # checkout (file://../general-simulation/...) until it's published to
      # https://robertsandoval.github.io/general-simulation. actions/checkout
      # can't place a repo outside $GITHUB_WORKSPACE, so clone it directly to
      # the workspace's parent dir to reproduce that local dev layout.
      - name: Checkout general-simulation (sibling Helm chart dependency)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/robertsandoval/general-simulation.git \
            "$(dirname "$GITHUB_WORKSPACE")/general-simulation"

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      # Pin 1.0.3: newer plugin releases use platformHooks (Helm >= 3.18 only).
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.3

      - name: Lint and unit test chart
        run: make helm-test
