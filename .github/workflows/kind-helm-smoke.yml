name: Kind Helm smoke

# Helm unittest, Kind deploy, and API verification (replaces separate helm-tests workflow).
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, development]
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "helm/**"
      - "scripts/ci/**"
      - "tests/e2e_ui/**"
      - "Makefile"
      - ".github/actions/kind/**"
      - ".github/workflows/kind-helm-smoke.yml"
  push:
    branches: [main, master, development]
    paths:
      - "app/backend/**"
      - "app/frontend/**"
      - "helm/**"
      - "scripts/ci/**"
      - "tests/e2e_ui/**"
      - "Makefile"
      - ".github/actions/kind/**"
      - ".github/workflows/kind-helm-smoke.yml"

concurrency:
  group: kind-helm-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  KIND_NAMESPACE: supply-chain-dashboard
  HELM_RELEASE: supply-chain-dashboard

jobs:
  kind-helm-smoke:
    name: Helm lint, Kind deploy, API and UI verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # helm/Chart.yaml pulls the general-simulation subchart from a sibling
      # checkout (file://../general-simulation/...) until it's published to
      # https://robertsandoval.github.io/general-simulation. actions/checkout
      # can't place a repo outside $GITHUB_WORKSPACE, so clone it directly to
      # the workspace's parent dir to reproduce that local dev layout.
      - name: Checkout general-simulation (sibling Helm chart dependency)
        run: |
          git clone --depth 1 --branch main \
            https://github.com/robertsandoval/general-simulation.git \
            "$(dirname "$GITHUB_WORKSPACE")/general-simulation"

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.3

      - name: Helm chart lint and unit tests
        run: make helm-test

      - name: Deploy chart on Kind
        uses: ./.github/actions/kind
        with:
          namespace: ${{ env.KIND_NAMESPACE }}
          helm_release: ${{ env.HELM_RELEASE }}
          registry: localhost:5001
          run_builtin_smoke: "false"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright UI test dependencies
        run: make e2e-ui-install

      - name: Verify deployment, API, and UI (Playwright)
        shell: bash
        run: RUN_UI_E2E=1 bash ./scripts/ci/kind-verify-deployment.sh
        env:
          NAMESPACE: ${{ env.KIND_NAMESPACE }}
          HELM_RELEASE: ${{ env.HELM_RELEASE }}
          # Kind chart disables Llama Stack (values-kind.yaml); UI smoke uses guardrail/route only.
          SKIP_MODEL_TESTS: "true"

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/

      - name: Upload Playwright screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
