name: Pull Request - Quality Checks & Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: make deps-all
      - run: make lint

  helm-unit-tests:
    name: Helm unit tests
    runs-on: ubuntu-latest
    env:
      HELM_PLUGINS: ${{ github.workspace }}/.helm-plugins
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4
      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.3
      - run: make helm-test

  helm-export-validate:
    name: Helm export validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4
      - uses: bmuschko/setup-kubeconform@v1
      - run: make helm-export-validate-demo

  pull-request-tests:
    name: Run unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: make deps-all
      - run: make test-all
      - run: make build-frontend-app
