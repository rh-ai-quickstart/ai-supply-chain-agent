name: Prepare Runner
description: Free disk space before Kind / image build jobs on GitHub-hosted runners

inputs:
  swap-storage:
    description: Enable swap storage (may slow down if heavily used)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: ${{ inputs.swap-storage }}
        tool-cache: false

    - name: Check memory and disk
      shell: bash
      run: |
        echo "=== Memory ==="
        free -h || true
        echo "=== Disk ==="
        df -h
