name: Kind cluster and Helm deploy
description: Create a Kind cluster with a local registry and install the supply-chain Helm chart

inputs:
  namespace:
    description: Kubernetes namespace for the release
    required: false
    default: supply-chain-dashboard
  helm_release:
    description: Helm release name
    required: false
    default: supply-chain-dashboard
  registry:
    description: Local registry host:port (Kind registry mirror)
    required: false
    default: localhost:5001
  helm_extra_args:
    description: Extra arguments passed to helm upgrade --install
    required: false
    default: ""
  skip_image_build:
    description: Skip building and pushing app images (use tags already in the local registry)
    required: false
    default: "false"
  wait_for_rollout:
    description: Wait for backend and frontend Deployments to become Available
    required: false
    default: "true"
  run_builtin_smoke:
    description: Run minimal /healthz check in this action (disable if the workflow runs kind-verify-deployment.sh)
    required: false
    default: "false"
  hf_token:
    description: Optional Hugging Face token (only needed if you enable general-simulation.llm-service via helm_extra_args)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Go (Kind CLI)
      uses: actions/setup-go@v5
      with:
        go-version: "1.22.x"

    - name: Install Kind
      shell: bash
      run: |
        go install sigs.k8s.io/kind@v0.30.0
        echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

    - name: Install Podman
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y podman
        podman version
        podman info

    - name: Create Kind cluster with local registry
      shell: bash
      env:
        USE_PODMAN: "1"
      run: bash ./scripts/ci/kind-with-registry.sh

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.19.4

    - name: Helm dependencies
      shell: bash
      run: make helm-deps

    - name: Build app images
      if: inputs.skip_image_build != 'true'
      shell: bash
      run: make kind-build-images REGISTRY=${{ inputs.registry }}

    - name: Push app images to local registry
      if: inputs.skip_image_build != 'true'
      shell: bash
      run: make kind-push-images REGISTRY=${{ inputs.registry }} PUSH_EXTRA_ARGS=--tls-verify=false

    - name: Create namespace
      shell: bash
      run: make k8s-namespace NAMESPACE=${{ inputs.namespace }}

    # Belt-and-suspenders: values-kind disables api.route, but keep a Route CRD
    # stub so a misconfigured overlay still renders on Kind.
    - name: Install OpenShift Route CRD stub (Kind)
      shell: bash
      run: kubectl apply -f ./scripts/ci/openshift-route-crd.yaml

    - name: Helm install (Kind values)
      id: helm_install
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf_token }}
      run: |
        set -euo pipefail
        EXTRA="${{ inputs.helm_extra_args }}"
        if [ -n "${HF_TOKEN}" ]; then
          EXTRA="${EXTRA} --set general-simulation.llm-service.secret.hf_token=${HF_TOKEN}"
        fi
        make helm-install-kind \
          NAMESPACE=${{ inputs.namespace }} \
          HELM_RELEASE=${{ inputs.helm_release }} \
          REGISTRY=${{ inputs.registry }} \
          HELM_EXTRA_ARGS="${EXTRA}"

    # helm --wait only prints "context deadline exceeded"; dump cluster state
    # so Pending PVCs / CrashLoops show up in the job log.
    - name: Dump cluster state on Helm install failure
      if: failure() && steps.helm_install.outcome == 'failure'
      shell: bash
      run: |
        set +e
        NS="${{ inputs.namespace }}"
        REL="${{ inputs.helm_release }}"
        echo "=== kubectl get deploy,sts,svc,pvc,job,sa,pods -n ${NS} ==="
        kubectl get deploy,sts,svc,pvc,job,sa,pods -n "${NS}" -o wide
        echo "=== kubectl get events -n ${NS} (last 50) ==="
        kubectl get events -n "${NS}" --sort-by=.lastTimestamp | tail -50
        echo "=== StorageClasses ==="
        kubectl get storageclass
        echo "=== helm status ==="
        helm status "${REL}" -n "${NS}" || true
        echo "=== Services on 7687 (Neo4j Bolt) ==="
        kubectl get svc -n "${NS}" -o wide | awk 'NR==1 || /7687/'
        dump_pod() {
          local pod="$1"
          echo "=== describe ${pod} ==="
          kubectl describe -n "${NS}" "${pod}" | tail -50
          kubectl logs -n "${NS}" "${pod}" --all-containers --tail=80 2>/dev/null || true
        }
        for dep in backend frontend general-sim-api pgvector neo4j postgres bootstrap; do
          echo "=== candidates matching *${dep}* ==="
          kubectl get pods -n "${NS}" -o name 2>/dev/null | grep -i "${dep}" | while read -r pod; do
            dump_pod "${pod}"
          done
        done
        # Official neo4j chart may name the STS after the release when
        # fullnameOverride is missing — catch that explicitly.
        if kubectl get pod -n "${NS}" "${REL}-0" >/dev/null 2>&1; then
          dump_pod "pod/${REL}-0"
        fi
        kubectl get jobs -n "${NS}" -o name 2>/dev/null | while read -r job; do
          echo "=== job describe ${job} ==="
          kubectl describe -n "${NS}" "${job}" | tail -40
          kubectl logs -n "${NS}" "job/$(basename "${job}")" --all-containers --tail=80 2>/dev/null || true
        done

    - name: Wait for app deployments
      if: inputs.wait_for_rollout == 'true'
      shell: bash
      run: |
        kubectl wait --namespace "${{ inputs.namespace }}" \
          --for=condition=available \
          "deployment/${{ inputs.helm_release }}-backend" \
          --timeout=300s
        kubectl wait --namespace "${{ inputs.namespace }}" \
          --for=condition=available \
          "deployment/${{ inputs.helm_release }}-frontend" \
          --timeout=300s

    - name: Smoke test backend /healthz
      if: inputs.wait_for_rollout == 'true' && inputs.run_builtin_smoke == 'true'
      shell: bash
      run: |
        set -euo pipefail
        kubectl port-forward -n "${{ inputs.namespace }}" \
          "svc/${{ inputs.helm_release }}-backend" 15001:5001 >/tmp/pf.log 2>&1 &
        PF_PID=$!
        trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT
        for _ in $(seq 1 30); do
          if curl -sf http://127.0.0.1:15001/healthz | grep -q '"ok"'; then
            echo "Backend healthz OK"
            exit 0
          fi
          sleep 2
        done
        echo "Backend /healthz did not become ready"
        cat /tmp/pf.log || true
        exit 1
